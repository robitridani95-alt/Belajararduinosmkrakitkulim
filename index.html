<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}

header{padding:12px 28px;display:flex;align-items:center;gap:14px}
.logo{width:34px;height:34px;border-radius:50%;background:#1f2a44;display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px}
h1{font:700 26px/1 'Barlow Condensed',sans-serif;letter-spacing:.2em;margin:0}
.sub{font:500 12px 'Barlow Condensed',sans-serif;letter-spacing:.35em;color:var(--mut)}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0;background:none}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:auto;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 8px 2px 6px;font:700 10px 'Barlow Condensed';letter-spacing:.08em;white-space:nowrap;box-shadow:0 2px 6px #0002;cursor:help;z-index:1}
.tag:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#19c6c0;margin-right:5px;box-shadow:0 0 0 3px #19c6c033}
.tag .d{display:none;position:absolute;left:0;top:100%;margin-top:4px;width:190px;white-space:normal;font:400 12px Barlow;letter-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;z-index:5}
.tag.wl{pointer-events:none;cursor:default}.tag.wl:before{background:var(--dc,#19c6c0);border:1px solid #0005;box-shadow:0 0 0 3px #0000001a}.tag:hover{z-index:6}.tag:hover .d{display:block}
#tools{position:absolute;right:14px;bottom:92px;display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px}
#tools button{border:0;background:none;color:var(--ink);width:30px;height:28px;font-size:16px;cursor:pointer;border-radius:6px}#tools button:hover{background:var(--bg)}
#bar{position:absolute;left:0;right:0;bottom:0;padding:6px 12px 10px;display:flex;gap:8px;overflow-x:auto}
.les{flex:0 0 auto;width:262px;display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 12px 8px 8px;cursor:pointer;color:var(--ink);position:relative;text-align:left;box-shadow:0 2px 8px #0000000f}
.les .th{width:104px;height:68px;border-radius:11px;flex:0 0 auto;background:#efe5cc center/cover no-repeat}
.les .tx{flex:1;text-align:center;font:700 15px/1.2 'Barlow Condensed',sans-serif;letter-spacing:.07em}
.les em{font-style:normal;font-size:26px;line-height:1;color:#2a8a94;font-weight:700}
.les.on{border-color:#2a9d8f;box-shadow:0 0 0 3px #2a9d8f2b}
.les b{position:absolute;top:-9px;right:-7px;width:24px;height:24px;border-radius:50%;background:#2a9d8f;color:#fff;font-size:14px;display:none;place-items:center;border:2px solid var(--bg)}.les.dn b{display:grid}
aside{width:380px;border-left:1px solid var(--line);background:var(--card);overflow:auto;padding:14px 16px}
.prog{display:flex;align-items:center;gap:10px;font:700 13px 'Barlow Condensed';letter-spacing:.08em}
.pb{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}.pb div{height:100%;background:#19c6c0;width:0;transition:width .4s}
.tabs{display:flex;gap:14px;margin:14px 0 10px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 0;font:700 12px 'Barlow Condensed';letter-spacing:.1em;color:var(--mut);cursor:pointer}.tabs .on{color:var(--ink);border-color:var(--acc)}
h2{font:700 20px 'Barlow Condensed';letter-spacing:.05em;margin:6px 0}
p{font-size:14px;line-height:1.5;color:var(--mut);margin:6px 0 10px}
.row{display:flex;gap:12px;align-items:center;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}.row span{font-size:18px}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:6px 4px;border-bottom:1px solid var(--line)}td:first-child{font-weight:700;width:38%}
code,textarea,#ser{font-family:'JetBrains Mono',monospace}
.try{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px}
.try h3{margin:0 0 8px;font:700 12px 'Barlow Condensed';letter-spacing:.12em;display:flex;justify-content:space-between;align-items:center}
textarea{width:100%;height:150px;border:0;background:var(--code);color:var(--ink);font-size:12px;line-height:1.5;padding:8px;border-radius:6px;resize:vertical}
#run{border:0;border-radius:6px;background:var(--acc);color:#fff;font:700 12px 'Barlow Condensed';letter-spacing:.08em;padding:6px 12px;cursor:pointer}#run.stop{background:var(--red)}
#ser{margin-top:8px;height:86px;overflow:auto;background:var(--code);border-radius:6px;padding:6px 8px;font-size:11px;color:var(--mut)}
.ctl{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:8px}.ctl input[type=range]{flex:1}
.hint{font-size:12px;color:var(--mut);padding:10px;background:var(--code);border-radius:6px}
@media(max-width:820px){body{overflow:auto}main{flex-direction:column}#stage{height:62vh;flex:none}aside{width:100%;border-left:0;overflow:visible}h1{font-size:20px}}
#cp{position:absolute;left:14px;top:14px;width:292px;max-width:calc(100% - 28px);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 28px #0002;padding:16px 18px 14px;z-index:20;display:none;font:400 13px Barlow,sans-serif;color:var(--ink);max-height:calc(100% - 100px);overflow:auto}
#cp h3{margin:0 28px 6px 0;font:700 17px 'Barlow Condensed',sans-serif;letter-spacing:.07em;text-transform:uppercase}
#cp .x{position:absolute;right:12px;top:8px;cursor:pointer;font-size:24px;line-height:1;color:var(--mut);background:none;border:0;padding:4px}
#cp p{margin:0 0 10px;color:var(--mut);line-height:1.4}
#cp .row{border-top:1px dashed var(--line);padding:10px 0 6px}
#cp .rl{display:flex;justify-content:space-between;align-items:center;font:700 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
#cp .rl span{font:500 12px 'JetBrains Mono',monospace;text-transform:none;letter-spacing:0}
#cp input[type=range]{width:100%;accent-color:#2a9d8f;margin:2px 0}
#cp .sw{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
#cp .sw i{width:42px;height:24px;border-radius:12px;background:#cfc8b3;position:relative;transition:.15s;flex:0 0 auto}
#cp .sw i:after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px #0003}
#cp .sw.on i{background:#2a9d8f}#cp .sw.on i:after{left:21px}
#cp .sg{display:flex;gap:6px;flex-wrap:wrap}
#cp .sg button,#cp .pb2{border:1px solid var(--line);background:#fff9;border-radius:10px;padding:7px 12px;font:700 12px 'Barlow Condensed',sans-serif;letter-spacing:.06em;cursor:pointer;color:var(--ink);touch-action:none}
#cp .sg button.on,#cp .pb2:active{background:#2a9d8f;color:#fff;border-color:#2a9d8f}
#cp .note{font-size:11px;color:#c2410c;margin:4px 0 0;display:none}
#cp .ft{display:flex;align-items:center;gap:10px;border-top:1px dashed var(--line);padding-top:12px;margin-top:8px}
#cp .zb{border:1px solid var(--line);background:#fff9;border-radius:10px;padding:8px 12px;font:700 12px 'Barlow Condensed',sans-serif;letter-spacing:.06em;cursor:pointer;color:var(--ink);white-space:nowrap}
#cp .hint{font-size:11px;color:#2a8a94;line-height:1.25}
.tabs{gap:11px;overflow-x:auto}.tabs button{white-space:nowrap;flex:none}.tabs button:last-child{color:#2a8a94}
.rvt{display:flex;gap:6px;margin:8px 0}.rvt button{flex:1;border:1px solid var(--line);background:#fff9;border-radius:8px;padding:6px;font:700 11px 'Barlow Condensed';letter-spacing:.08em;cursor:pointer;color:var(--ink)}.rvt .on{background:#2a9d8f;color:#fff;border-color:#2a9d8f}
.rimg{width:100%;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;display:block}.rcap{font-size:11px;color:var(--mut);text-align:center;margin:4px 0 10px}
.ri{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}.ri i{flex:0 0 24px;height:24px;border-radius:50%;background:#1f2a44;color:#fff;font:700 13px/24px 'Barlow Condensed';text-align:center;font-style:normal}.ri i.w{background:#e8962e}.ri b{display:block}.ri span{color:var(--mut)}
.rfb{margin-top:8px;width:100%;border:0;border-radius:8px;background:#2a9d8f;color:#fff;font:700 13px 'Barlow Condensed';letter-spacing:.08em;padding:9px;cursor:pointer}
#lb{position:fixed;inset:0;background:#000c;display:none;place-items:center;padding:14px;z-index:100;cursor:zoom-out}#lb img{max-width:100%;max-height:100%;border-radius:10px}
.nb{position:absolute;left:0;top:0;margin:-14px 0 0 -14px;width:28px;height:28px;border-radius:50%;background:#e5383b;color:#fff;font:700 16px/24px 'Barlow Condensed',Arial,sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 2px 6px #0005;pointer-events:none;z-index:2}.nb.w{background:#e8962e}
html,body{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}@supports(height:100dvh){html,body{height:100dvh}}
#stage{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media(max-width:820px){#stage{height:62vh;height:62dvh}textarea{font-size:16px}#tools button{width:40px;height:38px;font-size:18px}.rvt button{padding:10px 6px}#cp .sg button,#cp .pb2{padding:10px 14px}#cp .x{font-size:30px;padding:8px}#bar{-webkit-overflow-scrolling:touch}.les{width:236px}}
img.logo{width:auto;height:46px;border-radius:0;background:none;display:block}
.sch{font:700 15px/1.2 'Barlow Condensed',sans-serif;letter-spacing:.22em;color:var(--acc);margin:3px 0 2px}@media(max-width:820px){.sch{font-size:13px}}
.by{margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:4px 16px 4px 4px;box-shadow:0 2px 8px #0000000f}
.by img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 0 0 2px #2a9d8f}
.by small{display:block;font:500 10px 'Barlow Condensed',sans-serif;letter-spacing:.3em;color:var(--mut)}.by b{font:700 15px 'Barlow Condensed',sans-serif;letter-spacing:.08em;white-space:nowrap}
@media(max-width:820px){header{padding:10px 14px;flex-wrap:wrap}.by{padding:3px 12px 3px 3px;gap:8px}.by img{width:34px;height:34px}.by b{font-size:13px}}
#ld{position:fixed;inset:0;z-index:300;background:#f6eedd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s}#ld.off{opacity:0;pointer-events:none}
#ld img{height:min(34vh,240px);width:auto;animation:ldspin 1.8s linear infinite;filter:drop-shadow(0 8px 14px #0003)}
@keyframes ldspin{from{transform:perspective(700px) rotateY(0)}to{transform:perspective(700px) rotateY(360deg)}}
#ld .lt{font:700 22px 'Barlow Condensed',sans-serif;letter-spacing:.3em;color:#1f2a44;margin-top:10px}#ld .ls{font:500 14px Barlow,sans-serif;color:#8a8470;letter-spacing:.08em}
#ld .ls span{animation:ldb 1.2s infinite}#ld .ls span:nth-child(3){animation-delay:.2s}#ld .ls span:nth-child(4){animation-delay:.4s}@keyframes ldb{50%{opacity:.15}}

CODE.push(`const int LDR = A0;
const int LED = 13;

void loop() {
  int cahaya = analogRead(LDR);
  if (cahaya < 400) digitalWrite(LED, HIGH);
  else digitalWrite(LED, LOW);
  Serial.println(cahaya);
}`,`const int TRIG = 9;
const int ECHO = 10;

void setup() {
